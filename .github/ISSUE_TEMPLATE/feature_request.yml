name: 功能建议
description: 提议新能力、新工具面或既有工作流的改进
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提议前请先过一遍 README 的特性速览与 [docs/](../../docs) 目录，确认不是已有能力的重复或换皮。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你在什么真实场景下被卡住了？没有这个能力时你现在的绕法是什么？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 理想的命令面 / 配置面 / 工具面长什么样？给出示例用法最好。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 已有能力 + 脚本组合能否覆盖？为什么不够？
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 这属于 NexusCLI 的范围（终端 AI Agent 工具链），不是特定 provider 的服务端问题
          required: true
        - label: 方案讨论清晰后，我愿意尝试提交 PR
