name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra dev --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # A14 端点文档链：docs/runtime-api.md 端点表节必须与 api.py 的
      # ROUTE_MANIFEST 同步（scripts/generate_endpoint_docs.py 重新生成后比对）。
      - name: Check endpoint docs sync
        run: uv run python scripts/check_endpoint_docs.py

      # F13 mypy 渐进接入: 配置(含「只减不增」排除清单)见 pyproject.toml [tool.mypy]。
      # 用 --with mypy 临时注入, 不动 uv.lock; 排除清单外任何文件出现新错误都会红。
      - name: Mypy (progressive)
        run: uv run --with mypy mypy src/nexuscli

      - name: Run tests
        run: uv run python -m pytest

  frontend:
    name: Build (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Check committed dist is in sync
        run: test -z "$(git status --porcelain -- frontend/dist)"
