name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "TUTORIAL.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Re-render docs/*.md + TUTORIAL.md into site/ so the deployed pages
      # are always in sync with the sources, even if site/*.html was stale.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build site pages
        run: |
          python -m pip install --quiet markdown pygments
          python site/build.py
          # self-contained interactive architecture viewer (see README)
          cp docs/architecture.html site/architecture.html

      - uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
